    {"q": "小冊子常識篇中，有些人停止定期運動後身體開始發胖，主要原因是什麼減少了？", "h": "飲食習慣未變，但不運動了，卡路里的「去路」就斷了。", "o": [{"t": "熱量的消耗", "r": "正解！停止運動後熱量消耗大量減少，若飲食不變，剩餘熱量便轉化為脂肪。", "c": true}, {"t": "熱量的攝入", "r": "錯誤，攝入沒變而消耗變少才導致發胖。", "c": false}, {"t": "細胞的數量", "r": "錯誤，發胖是脂肪細胞體積增大。", "c": false}, {"t": "身體的水分", "r": "錯誤，水分減少會減輕體重。", "c": false}]},
    {"q": "★ 針對停止運動後發胖的問題，小冊子在常識篇給出的最終結論是什麼？", "h": "體育小冊子的核心宗旨，永遠是鼓勵大眾做什麼。", "o": [{"t": "做運動較好", "r": "正解！小冊子明確得出結論：做運動較好，不能因為停止會發胖就因噎廢食。", "c": true}, {"t": "不做運動較好", "r": "錯誤，這是因噎廢食的觀點。", "c": false}, {"t": "視乎體型，只有天生肥胖的人才需要", "r": "錯誤，運動對所有體型的人都有好處。", "c": false}, {"t": "完全沒有任何分別", "r": "錯誤，兩者對健康影響巨大。", "c": false}]},
    {"q": "★ 根據小冊子常識篇，為甚麼飯後不宜作劇烈運動？主要生理原因是什麼？", "h": "涉及血液爭奪戰，胃腸消化需要它，肌肉跑步也需要它。", "o": [{"t": "飯後血液需集中於消化器官，立即運動會使血液流向骨骼肌，胃腸蠕動減弱，引起消化不良", "r": "正解！小冊子清楚解釋了飯後血液重新分配的機制，立即運動損害消化功能。", "c": true}, {"t": "因為胃裡的食物會在外力震盪下直接進入肺部導致窒息", "r": "錯誤，兩者通道分開，此選項不科學。", "c": false}, {"t": "因為飯後骨骼會變軟，運動容易造成嚴重的關節骨折", "r": "錯誤，飲食不會在飯後立刻改變骨骼硬度。", "c": false}, {"t": "因為運動會讓食物中的毒素加速擴散到全身大腦細胞", "r": "錯誤，正常食物不含毒素。", "c": false}]},
    {"q": "★ 飯後如果立即進行劇烈運動，小冊子指出最容易引發身體哪種即時的主觀不適症狀？", "h": "這個疼痛部位位於腹部，直接與受影響的消化器官相關。", "o": [{"t": "胃痛（或消化不良）", "r": "正解！小冊子常識篇第(2)點明確指出，飯後立即劇烈運動會引起胃痛。", "c": true}, {"t": "偏頭痛", "r": "錯誤，與飯後運動無直接生理機制。", "c": false}, {"t": "腳底抽筋", "r": "錯誤，抽筋與缺鈣、受涼或局部過度疲勞有關。", "c": false}, {"t": "耳朵發炎", "r": "錯誤，屬於細菌感染或耳道疾病。", "c": false}]},
    {"q": "★ 為什麼女性進行重量訓練後，不會像男性那樣練出非常碩大發達的肌肉塊？", "h": "這是一個關鍵的激素名稱，男性的分泌量是女性的許多倍。", "o": [{"t": "因為女性體內的雄性激素（睾丸酮）水平遠低於男性", "r": "正解！肌肉生長高度依賴雄性激素，女性分泌量極少，因此不易练出大肌肉塊。", "c": true}, {"t": "因為女性的肌肉纖維是由完全不同、無法膨脹的蛋白質組成的", "r": "錯誤，男女肌肉微觀結構本質相同。", "c": false}, {"t": "因為女性在重訓時無法承受超過5公斤的重量負荷", "r": "錯誤，許多女性運動員能承受高負荷。", "c": false}, {"t": "因為女性的皮下脂肪層會自動將所有練出的肌肉完全溶解掉", "r": "錯誤，脂肪與肌肉是平行組織，無法互相溶解。", "c": false}]},
    {"q": "★ 根據小冊子常識篇，女性進行適度的重量訓練，能夠為身體帶來什麼主要好處？", "h": "它不會讓女性變得粗壯，反而能修飾身體各處的線條。", "o": [{"t": "能使身材更修長、更有彈性，展現女性的健美體態", "r": "正解！重訓能修飾女性線條，讓身材更健美、有彈性。", "c": true}, {"t": "能讓聲音變得像男性一樣低沉雄渾", "r": "錯誤，適度重訓不影響聲帶。", "c": false}, {"t": "能讓身高在成年後再次暴長10公分以上", "r": "錯誤，成年後骨骺線已閉合。", "c": false}, {"t": "能讓大腦細胞數量翻倍，變得更加聰明", "r": "錯誤，不會翻倍細胞數量。", "c": false}]},
    {"q": "★ 為了在運動後迅速「恢復體力，消除疲勞」，小冊子推薦的方法不包括下列哪一項？", "h": "運動後身體已大量失水，去極熱且封閉的地方非常危險。", "o": [{"t": "立刻到桑拿房進行兩小時以上的超高溫乾蒸", "r": "正解！文中推薦的是睡眠、整理運動、水分營養。立刻高溫乾蒸會加劇脫水，非常危險。", "c": true}, {"t": "保證充足的睡眠與休息", "r": "錯誤，這是文中推薦的核心消除疲勞手段。", "c": false}, {"t": "進行適當的伸展拉筋等整理運動", "r": "錯誤，整理運動能幫助血液回流、緩解酸痛。", "c": false}, {"t": "及時補充水分與均衡的營養", "r": "錯誤，補充消耗的能量和液體是恢復的基礎。", "c": false}]},
    {"q": "小冊子常識篇第(5)點探討「為什麼游泳比其他運動佳」，其提及的最核心生理優勢是什麼？", "h": "水裡有一種「向上的力量」托住身體，減少了衝擊力。", "o": [{"t": "水有浮力，能大大減輕關節（特別是膝關節和脊椎）的負重與衝擊力", "r": "正解！游泳利用浮力減少了重力磨損，極適合各年齡層與關節復康。", "c": true}, {"t": "在水裡運動能讓人天生學會用皮膚直接呼吸氧氣", "r": "錯誤，人類依然必須靠口鼻浮出水面呼吸。", "c": false}, {"t": "游泳能讓體溫永久保持在攝氏20度，永遠不會發燒", "r": "錯誤，不符合人體恆溫動物生理學。", "c": false}, {"t": "游泳是世界上唯一一種不需要消耗任何卡路里的運動", "r": "錯誤，游泳消耗的卡路里其實非常高。", "c": false}]},
    {"q": "小冊子指出「穿膠衣進行運動去增加出汗」來減肥，其排出的主要到底是什麼？喝水後會怎樣？", "h": "汗水的成分九成以上都是水，補充後體重就會立刻恢復。", "o": [{"t": "排出的只是身體的水分，喝水後體重會立刻回復，無法真正減去脂肪", "r": "正解！小冊子明確指出出汗減重只是暫時脫水，且阻礙散熱極易中暑。", "c": true}, {"t": "排出的全都是液態化的純脂肪，喝水後脂肪也不會回來", "r": "錯誤，汗腺不可能直接排出脂肪。", "c": false}, {"t": "排出的是體內的骨質，喝水後會加速骨骼生長", "r": "錯誤，排汗不排出骨質。", "c": false}, {"t": "穿膠衣能將汗水在體表直接轉化為肌肉", "r": "錯誤，汗水和肌肉是截然不同的物質。", "c": false}]},
    {"q": "穿膠衣運動去強行增加出汗，在臨床或運動安全上會帶來什麼重大危險？", "h": "排汗是為了「散熱」，如果不透氣的衣服把全身裹死，熱量散不出去會如何。", "o": [{"t": "阻礙汗水蒸發散熱，極易導致體溫過高、中暑、嚴重脫水甚至休克", "r": "正解！膠衣不透氣，身體無法靠汗水蒸發散熱，會引發嚴重熱疾病。", "c": true}, {"t": "會導致皮膚天生退化，變成魚鱗狀的組織", "r": "錯誤，這是不合常理的虛構選項。", "c": false}, {"t": "會導致肺部停止工作，讓人當場忘記如何呼吸", "r": "錯誤，影響的是散熱和水鹽平衡。", "c": false}, {"t": "會讓身體產生強烈的放射性核輻射", "r": "錯誤，這與核物理毫無關係。", "c": false}]},
    {"q": "★ 小冊子探討「為何游泳比賽中黑人運動員相對較少」，文中提出的先天身體條件原因是什麼？", "h": "物體在水中的浮沉取決於密度。想想「骨骼肌肉」與「脂肪」的密度差異。", "o": [{"t": "黑人的身體骨骼和肌肉密度較高，體脂率相對較低，導致在水中的自然浮力較小", "r": "正解！生理學分析指出黑人運動員骨骼密度高、脂肪比例低，水中自然浮力較小。", "c": true}, {"t": "因為黑人的皮膚缺乏防水層，在水裡泡久了體重會增加一倍", "r": "錯誤，人類皮膚都具有基本的屏障功能。", "c": false}, {"t": "因為黑人天生缺乏在水中睜開眼睛看清方向的能力", "r": "錯誤，視力與膚色種族無關。", "c": false}, {"t": "因為黑人的平均身高太矮，手腳長度不足以進行劃水", "r": "錯誤，事實上許多黑人運動員身材高大、臂展極長。", "c": false}]},
    {"q": "★ 除了先天生理條件，小冊子指出造成游泳比賽中黑人較少的「社會原因」是什麼？", "h": "興建高規格的室內溫水游泳池需要大筆資金與社區資源支援。", "o": [{"t": "歷史上黑人社區的游泳池普及率與基礎訓練資源相對匱乏，且存在文化傳統導向", "r": "正解！這受到經濟、歷史及體育傳統等社會環境因素的共同制約。", "c": true}, {"t": "因為國際游泳聯合會明文禁止黑人選手報名參加奧運會游泳項目", "r": "錯誤，國際泳聯嚴禁種族歧視。", "c": false}, {"t": "因為購買專業泳衣和泳帽的費用高達數百萬美元，常人無法負擔", "r": "錯誤，裝備費用被極度誇大。", "c": false}, {"t": "因為大部分黑人居住的非洲大陸上完全沒有任何河流、湖泊或海洋", "r": "錯誤，非洲擁有尼羅河等豐富水體，地理常識錯誤。", "c": false}]},
    {"q": "★ 根據常識篇第(8)點，為什麼「亞洲人較擅長打羽毛球和乒乓球」？這類運動更依賴亞洲人的哪些身體特點？", "h": "面對高速飛行的小球，比起絕對大力量，更需要什麼能力。", "o": [{"t": "身體的靈活性、敏捷度、反應速度以及對小球的細緻控制力", "r": "正解！小冊子指出乒羽運動看重速度、靈敏和技巧，契合亞洲人生理優勢。", "c": true}, {"t": "亞洲人的上肢力量超越黑人，下肢衝擊力超越白人", "r": "錯誤，在絕對純力量上亞洲人並非絕對優勢。", "c": false}, {"t": "亞洲人的平均身高高居全球之冠，覆蓋球場範圍極大", "r": "錯誤，全球平均身高最高的地區通常是西歐或北歐。", "c": false}, {"t": "亞洲人天生擁有四隻手臂，在接球時具有物理數量優勢", "r": "錯誤，此選項完全荒謬。", "c": false}]},
    {"q": "★ 在保齡球歷史部分，英皇愛德華三世曾下令全面禁止「九柱戲」，其唯恐這項活動會妨礙士兵練習什麼？", "h": "這是在古代英國軍隊最引以為傲、殺傷力最強的遠程技術。", "o": [{"t": "箭術", "r": "正解！小冊子保齡球篇明確寫道：英皇愛德華三世唯恐此項活動會妨礙箭術的練習。", "c": true}, {"t": "騎馬", "r": "錯誤，禁令是為了保護箭術練習。", "c": false}, {"t": "游泳", "r": "錯誤，古代英國防禦首重長弓。", "c": false}, {"t": "拼刺刀", "r": "錯誤，愛德華三世時期尚未發明現代刺刀。", "c": false}]},
    {"q": "★ 保齡球的前身「九柱戲」在受到皇家禁令後，在相當長的一段時間裡，它演變成了什麼形式盛行於何處？", "h": "當一項健康的運動被官方封殺，它往往會轉入地下並與金錢結合。", "o": [{"t": "作為一種賭博形式盛行於地下的私人酒吧間", "r": "正解！原文寫道：此後在相當長的一段時間裡，成為一種賭博形式盛行於地下的私人酒吧間。", "c": true}, {"t": "作為一種高雅的宮廷舞蹈盛行於女皇的宴會廳", "r": "錯誤，它流入了地下酒吧，帶有賭博性質。", "c": false}, {"t": "作為一種軍事密碼代號盛行於海軍戰艦上", "r": "錯誤，與軍事代號完全無關。", "c": false}, {"t": "作為一種學術討論課題盛行於牛津和劍橋大學", "r": "錯誤，當時屬於法定的非法娛樂。", "c": false}]},
    {"q": "★ 根據小冊子記載，保齡球運動後來傳入亞洲，下列哪一組國家和地區是文中明確列出「很受歡迎」的？", "h": "這串名單包含了香港、台灣、日本以及東南亞的幾個國家。", "o": [{"t": "日本、台灣、香港、菲律賓、馬來西亞、新加坡、泰國", "r": "正解！小冊子結尾段落完整列出了這幾個東亞及東南亞的國家和地區。", "c": true}, {"t": "蒙古、西藏、北韓、哈薩克、烏茲別克", "r": "錯誤，非原文中所記錄的名單。", "c": false}, {"t": "冰島、格陵蘭、俄羅斯、埃及、南非", "r": "錯誤，這些不屬於亞洲地區。", "c": false}, {"t": "印度、巴基斯坦、尼泊爾、不丹、馬爾地夫", "r": "錯誤，非小冊子明確列出的特定名單。", "c": false}]},
    {"q": "小冊子總結了保齡球運動能夠風行全球的四個原因，其中第一點提到它有別於足球籃球，具有什麼人數上的優勢？", "h": "有時候你想打球卻湊不夠人，但保齡球只要「一個人」就能開局。", "o": [{"t": "它不像許多球類運動那樣必須聚集多人才能成軍", "r": "正解！保齡球可以單人練習或單獨計分，組隊門檻極低。", "c": true}, {"t": "它強制要求每場比賽必須有恰好100人同時上場", "r": "錯誤，不需要這麼多人。", "c": false}, {"t": "它規定只能由雙胞胎組隊才能參加正式比賽", "r": "錯誤，此選項純屬虛構。", "c": false}, {"t": "它必須男女老少共計11人組成一個方陣才能滾動", "r": "錯誤，一個人就能玩。", "c": false}]},

let processedQuestions = [];
let currentQuestionIndex = 0;
let score = 0;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    processedQuestions = shuffle(JSON.parse(JSON.stringify(rawQuestions))).slice(0, 50);
    renderQuestion();
}

function renderQuestion() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    
    if(currentQuestionIndex >= processedQuestions.length) {
        showResult();
        return;
    }

    const qData = processedQuestions[currentQuestionIndex];
    const shuffledOptions = shuffle([...qData.o]);

    const quizBox = document.createElement('div');
    quizBox.className = 'quiz-box active';

    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.innerText = `第 ${currentQuestionIndex + 1} 題 / 共 50 題：\n${qData.q}`;
    quizBox.appendChild(qDiv);

    const hintBtn = document.createElement('button');
    hintBtn.className = 'hint-btn';
    hintBtn.innerText = '💡 查看考點提示';
    hintBtn.onclick = () => {
        const hText = quizBox.querySelector('.hint-text');
        hText.style.display = hText.style.display === 'block' ? 'none' : 'block';
    };
    quizBox.appendChild(hintBtn);

    const hintText = document.createElement('div');
    hintText.className = 'hint-text';
    hintText.innerText = qData.h;
    quizBox.appendChild(hintText);

    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';

    shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt.t;
        btn.onclick = () => selectOption(btn, opt.c, opt.r, optionsDiv, nextBtn);
        optionsDiv.appendChild(btn);
    });
    quizBox.appendChild(optionsDiv);

    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback';
    quizBox.appendChild(feedbackDiv);

    const nextBtn = document.createElement('button');
    nextBtn.className = 'nav-btn';
    nextBtn.innerText = currentQuestionIndex === 49 ? '🏁 查看終極總成績' : '下一題 ➡️';
    nextBtn.onclick = () => {
        currentQuestionIndex++;
        updateProgressBar();
        renderQuestion();
    };
    quizBox.appendChild(nextBtn);

    container.appendChild(quizBox);
}

function selectOption(selectedBtn, isCorrect, rationale, optionsDiv, nextBtn) {
    const buttons = optionsDiv.querySelectorAll('.option');
    buttons.forEach(btn => btn.disabled = true);

    if (isCorrect) {
        selectedBtn.classList.add('correct');
        score++;
    } else {
        selectedBtn.classList.add('incorrect');
        buttons.forEach(btn => {
            if(btn.innerText === processedQuestions[currentQuestionIndex].o.find(o=>o.c).t) {
                btn.classList.add('correct');
            }
        });
    }

    const feedback = optionsDiv.nextElementSibling.nextElementSibling;
    feedback.className = 'feedback show';
    feedback.style.borderLeftColor = isCorrect ? 'var(--success)' : 'var(--error)';
    feedback.innerHTML = `<strong>${isCorrect ? '✅ 回答正確！' : '❌ 回答錯誤'}</strong><br>${rationale}`;

    nextBtn.style.display = 'block';
}

function updateProgressBar() {
    const pct = (currentQuestionIndex / 50) * 100;
    document.getElementById('progress').style.width = `${pct}%`;
}

function showResult() {
    document.getElementById('progress').style.width = '100%';
    document.getElementById('quiz-container').style.display = 'none';
    const screen = document.getElementById('result-screen');
    screen.style.display = 'block';
    document.getElementById('score-display').innerText = `${score} / 50 分`;
    
    const comment = document.getElementById('comment');
    if(score === 50) {
        comment.innerText = '🥇 太神了！50題滿分！你已經把小冊子徹底吃透，明天穩拿全優！';
    } else if(score >= 40) {
        comment.innerText = '🌟 表現極佳！錯誤率極低，明天的筆試高分通過毫無懸念！';
    } else {
        comment.innerText = '📚 建議再多盲刷一遍，點擊下方按鈕重新打亂，加深粗體字考點印象！';
    }
}

window.onload = initQuiz;
</script>
